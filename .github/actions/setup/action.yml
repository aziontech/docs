name: Setup
description: pnpm + Node from .nvmrc + a frozen install. The preamble every job repeats.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`. Set to 'false' for a job that only needs the checkout.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      # No `version:` on purpose — it resolves from `packageManager` in package.json,
      # so the lockfile and CI can never drift apart.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
