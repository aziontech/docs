name: Compliance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '4 6 * * 1'

permissions: {}

jobs:
  compliance:
    name: Engineering Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # PR comment with compliance report
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: aziontech/azion-action-compliance@v0
