name: CI gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      content: ${{ steps.filter.outputs.content }}
      platform: ${{ steps.filter.outputs.platform }}
      redirects: ${{ steps.filter.outputs.redirects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Touching the gate itself, or any config it enforces, re-runs everything —
            # otherwise a PR that breaks the gate is the one PR the gate never sees.
            gate: &gate
              - '.github/workflows/ci-gate.yml'
              - '.github/actions/setup/**'
              - 'ci/baselines.json'
              - 'scripts/ci/**'
              - 'eslint.config.mjs'
              - '.prettierrc*'
              - '.prettierignore'
              - '.stylelintrc*'
              - '.nvmrc'
            content:
              - 'apps/docs/src/content/**'
              - 'apps/docs/src/i18n/**'
              - 'apps/docs/src/nav/**'
              - *gate
            platform:
              - 'apps/docs/src/**'
              - 'apps/docs/plugins/**'
              - 'apps/docs/integrations/**'
              - 'apps/docs/scripts/**'
              - 'scripts/**'
              - 'apps/docs/astro.config.ts'
              - 'apps/docs/tsconfig.json'
              - 'apps/docs/postcss.config.js'
              - 'apps/docs/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - *gate
            redirects:
              - 'apps/docs/redirects/**'
              - 'apps/docs/cicd/massive-redirects/**'
              - 'apps/docs/package.json'
              - *gate

  security:
    name: Security scans
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Audit dependencies (ratchet)
        run: pnpm ci:ratchet audit

      - name: Secret detection
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  content:
    name: Content integrity
    needs: changes
    if: ${{ needs.changes.outputs.content == 'true' || needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Navigation tree
        run: pnpm lint:navcheck

      - name: Translation slugs (ratchet)
        run: pnpm ci:ratchet slugcheck

  code-quality:
    name: Code quality
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Collect changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > changed.txt
          grep -E '\.(js|mjs|cjs|ts|tsx|vue|astro)$' changed.txt > changed-code.txt || true
          grep -E '\.(css|scss|vue|astro)$' changed.txt > changed-style.txt || true
          grep -E '\.(js|mjs|cjs|ts|tsx|vue|astro|json|md|mdx|yml|yaml|css|scss)$' changed.txt > changed-fmt.txt || true
          echo "code=$(wc -l < changed-code.txt)" >> "$GITHUB_OUTPUT"
          echo "style=$(wc -l < changed-style.txt)" >> "$GITHUB_OUTPUT"
          echo "fmt=$(wc -l < changed-fmt.txt)" >> "$GITHUB_OUTPUT"

      - name: ESLint (zero warnings on changed files)
        if: ${{ always() && steps.diff.outcome == 'success' && steps.diff.outputs.code != '0' }}
        run: tr '\n' '\0' < changed-code.txt | xargs -0 pnpm exec eslint --max-warnings 0 --no-warn-ignored

      - name: Prettier (changed files)
        if: ${{ always() && steps.diff.outcome == 'success' && steps.diff.outputs.fmt != '0' }}
        run: tr '\n' '\0' < changed-fmt.txt | xargs -0 pnpm exec prettier --check --plugin-search-dir=.

      - name: Stylelint (changed files)
        if: ${{ always() && steps.diff.outcome == 'success' && steps.diff.outputs.style != '0' }}
        run: tr '\n' '\0' < changed-style.txt | xargs -0 pnpm exec stylelint

      - name: astro check (ratchet)
        if: always()
        run: pnpm ci:ratchet astro-check

  redirects:
    name: Redirects
    needs: changes
    if: needs.changes.outputs.redirects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'

      # `pnpm --filter docs redirects:publish --dry-run` cannot run here: it needs AZION_TOKEN
      # and AZION_APPLICATION_ID and reads the live function instances, and a pull request
      # (from a fork above all) gets no secrets. This step applies the same offline rules the
      # publish script checks before it writes anything, so a file it would refuse fails the PR
      # instead of failing the publish after the merge.
      - name: Validate redirect data
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync } from 'node:fs';
          import { en, pt } from './apps/docs/redirects/index.js';

          const LIMIT_BYTES = 300 * 1024;
          const errors = [];

          for (const [lang, files] of Object.entries({ en, 'pt-br': pt })) {
            // A file index.js does not load is never published.
            const indexed = Object.keys(files).map((key) => `${key}.json`);
            for (const name of readdirSync(`apps/docs/redirects/${lang}`)) {
              if (name.endsWith('.json') && !indexed.includes(name))
                errors.push(`${lang}/${name} is not loaded by apps/docs/redirects/index.js, so it is never published`);
            }

            for (const [key, entries] of Object.entries(files)) {
              const file = `${lang}/${key}.json`;
              if (!Array.isArray(entries) || entries.length === 0) {
                errors.push(`${file}: expected a non-empty array of redirects`);
                continue;
              }
              const bytes = Buffer.byteLength(JSON.stringify(entries));
              if (bytes > LIMIT_BYTES)
                errors.push(`${file} is ${(bytes / 1024).toFixed(1)} KB, over the 300 KB Massive Redirect limit`);
              entries.forEach((entry, index) => {
                const has = (field) => typeof entry?.[field] === 'string';
                if (has('from') === has('from_regex'))
                  errors.push(`${file}[${index}]: needs exactly one of "from" / "from_regex"`);
                if (has('moved') === has('found'))
                  errors.push(`${file}[${index}]: needs exactly one of "moved" / "found"`);
              });
              console.log(`ok    ${file}: ${entries.length} redirects, ${(bytes / 1024).toFixed(1)} KB`);
            }
          }

          for (const error of errors) console.log(`::error::${error}`);
          if (errors.length) process.exit(1);
          EOF

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build and validate frontmatter
        run: pnpm build:local
        env:
          NODE_OPTIONS: --max-old-space-size=8120


  ci-gate:
    name: CI gate
    needs: [changes, security, content, code-quality, redirects, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        run: |
          declare -A results=(
            [changes]="${{ needs.changes.result }}"
            [security]="${{ needs.security.result }}"
            [content]="${{ needs.content.result }}"
            [code-quality]="${{ needs['code-quality'].result }}"
            [redirects]="${{ needs.redirects.result }}"
            [build]="${{ needs.build.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "FAIL  $job: $result"
              failed=1
            else
              echo "ok    $job: $result"
            fi
          done
          if [[ $failed -eq 1 ]]; then
            echo "The CI gate did not pass."
            exit 1
          fi
          echo "CI gate passed."
