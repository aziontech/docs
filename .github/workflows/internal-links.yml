name: Internal links

# Called by ci-gate.yml. It runs against the `dist` the build already produced instead of
# building a second time: the checker reads only the sitemaps and the HTML, which is why
# the build packs exactly those. Downloading and unpacking costs 8 s; a second build
# would cost 167 s.
#
# Kept in its own file because it is a self-contained check with its own baseline and its
# own failure mode, and because the `on: workflow_call` shape is what lets it move — to
# another caller, or out of the gate — without touching the graph.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact holding the packed HTML and sitemaps.
        required: false
        type: string
        default: dist-html

permissions:
  contents: read

jobs:
  internal-links:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}

      - name: Unpack the build output
        run: tar -xzf dist-html.tar.gz

      # Ratchet. The checker had been pointed at the wrong base URL since the Astro fork,
      # so it parsed zero pages and always said "no link issues". With the URL fixed it
      # reports real numbers, and most of them are links to www.azion.com pages that live
      # in the site repo, not here — which is a configuration job, not this branch's.
      - name: Link check (ratchet)
        run: pnpm ci:ratchet linkcheck
