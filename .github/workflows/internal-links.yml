name: Internal links

# Standalone: its own trigger, its own concurrency, its own check.
#
# Being independent has a price, and it is worth naming. This workflow builds the site
# itself — ~2 min — because a workflow with its own trigger runs in its own run, and
# artifacts do not cross runs. While it was called from `ci-gate.yml` it downloaded the
# `dist` the gate had already produced and cost 9 s instead.
#
# What independence buys: it can be re-run on its own, it cannot be held up by an
# unrelated job, and it can be moved or switched off without editing the gate. It runs in
# parallel with the gate, so the extra build costs runner minutes, not wall-clock.
#
# OG image generation is skipped: the checker reads HTML and sitemaps, never the images.

on:
  pull_request:
    branches:
      - main
      - release/new-azion-docs
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  internal-links:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build the site
        run: pnpm build:local
        env:
          NODE_OPTIONS: --max-old-space-size=8120
          SKIP_OG: 'true'

      # Ratchet. The checker had been pointed at the wrong base URL since the Astro fork,
      # so it parsed zero pages and always said "no link issues". With the URL fixed it
      # reports real numbers, and most of them are links to www.azion.com pages that live
      # in the site repo, not here — which is a configuration job, not this branch's.
      - name: Link check (ratchet)
        run: pnpm ci:ratchet linkcheck
