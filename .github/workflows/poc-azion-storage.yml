name: POC - Azion Object Storage

# Runs only on the POC branch. The dev/stage/prod pipelines are untouched:
# they trigger on pushes to dev/stage/main, which this branch is not.
on:
  push:
    branches:
      - poc/azion-storage

jobs:
  publish:
    name: Publish dist to Azion Object Storage
    runs-on: ubuntu-latest
    env:
      BUCKET: adocs-preview
    steps:
      - name: CHECKOUT project
        uses: actions/checkout@v4

      - name: SETTING pnpm
        uses: pnpm/action-setup@v4

      - name: SETTING Node and Github Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - name: INSTALLING DEPENDENCIES
        run: |
          pnpm install --frozen-lockfile

      - name: BUILD
        run: |
          export NODE_OPTIONS="--max-old-space-size=8120"
          export PUBLIC_GITHUB_TOKEN="${{ secrets.GH_PACKAGES_SECRET }}"
          pnpm run build:dev

      - name: PUBLISHING to Azion Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AZION_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AZION_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-005
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --endpoint-url https://s3.us-east-005.azionstorage.net
