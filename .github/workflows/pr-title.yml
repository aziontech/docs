name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title, no ticket codes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check type(scope) format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            i18n
            refactor
            chore
          requireScope: true
          # Imperative summaries start lowercase. This is what rejects
          # "Enhance documentation on..." and "Update en.json".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The summary "{subject}" must start with a lowercase letter and read as an
            imperative, for example "clarify Bot Manager scoring rules".

      - name: Reject ticket codes in the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -qE '^\[?[A-Z]{2,}-[0-9]+\]?|\[[A-Z]{2,}-[0-9]+\]'; then
            echo "::error::Ticket codes do not belong in PR titles. Put the ticket in the branch name (EDU-1234-short-slug) and the Related issue field in the PR body."
            exit 1
          fi
