name: PR checks
on:
  pull_request:
    branches:
      - main
      # The new-docs work lands here first, so PRs to it need the same checks.
      - release/new-azion-docs
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate navigation
        run: pnpm lint:navcheck

      - name: Build and validate frontmatter
        run: pnpm build:local
        env:
          NODE_OPTIONS: --max-old-space-size=8120

      # Design-system adoption: measured, never enforced. The report lands in the run
      # Summary; `if: always()` so it still appears when a step above fails, and
      # `continue-on-error` so a red number never blocks the PR.
      - name: Webkit adoption report
        if: always()
        continue-on-error: true
        run: |
          pnpm lint:webkit
          pnpm --silent report:webkit-adoption >> "$GITHUB_STEP_SUMMARY"
