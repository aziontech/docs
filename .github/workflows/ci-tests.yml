name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  integration:
    name: Content validator (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      # The test package is standalone: it does not install the site.
      - name: Install test dependencies
        working-directory: tests/vitest
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Run Vitest integration tests
        working-directory: tests/vitest
        run: pnpm test
