name: Design system adoption

# Called by ci-gate.yml. Measured, not enforced — for now.
#
# Its own file because it is the seam with the design system: the four-stage gate
# (wiring · canary · adoption ratchet · style) being built on chore/webkit-gate replaces
# the body of this workflow, and eventually the whole file becomes one `uses:` of
# @aziontech/webkit's own reusable workflow. Keeping that churn out of ci-gate.yml means
# the graph stays still while the design system's contract moves.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  design-system-adoption:
    name: Design system adoption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Adoption report
        if: always()
        continue-on-error: true
        run: |
          pnpm lint:webkit
          pnpm --silent report:webkit-adoption >> "$GITHUB_STEP_SUMMARY"
