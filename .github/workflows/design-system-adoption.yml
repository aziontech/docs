name: Design system adoption

# Standalone: its own trigger, its own concurrency, its own check.
#
# The number is reported to the Summary and then enforced with no tolerance: the baseline
# is zero, so the 72 violations currently in the tree fail this check until they are fixed.
#
# It needs nothing from the rest of the pipeline — no build, no artifact — so being
# independent costs it nothing. This is also the seam with the design system: the
# four-stage gate (wiring · canary · adoption ratchet · style) being built on
# chore/webkit-gate replaces the body of this workflow, and eventually the whole file
# becomes one `uses:` of @aziontech/webkit's own reusable workflow.

on:
  pull_request:
    branches:
      - main
      - release/new-azion-docs
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'integrations/**'
      - 'eslint.config.mjs'
      - '.stylelintrc*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/design-system-adoption.yml'
      - '.github/actions/setup/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design-system-adoption:
    name: Design system adoption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The report goes to the Summary first, unconditionally, so the number reaches the
      # reader whatever the ratchet below decides.
      - name: Adoption report
        if: always()
        continue-on-error: true
        run: |
          pnpm lint:webkit
          pnpm --silent report:webkit-adoption >> "$GITHUB_STEP_SUMMARY"

      # Blocking, with the baseline at zero: no violation is tolerated. This is red today —
      # 72 violations across 30 files, adoption 65% — and stays red until they are fixed.
      #
      # That is the point. The step used to run with `continue-on-error` and reported green
      # over all 72, which is the same failure mode as the link checker that said "no link
      # issues" because it parsed zero pages: a check nobody can trust. A ratchet at 72
      # would have kept the merge unblocked, and was rejected for the same reason.
      - name: No design-system violations
        run: pnpm ci:ratchet webkit-adoption
