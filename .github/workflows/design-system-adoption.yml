name: Design system adoption

# Standalone: its own trigger, its own concurrency, its own check.
#
# The number is reported to the Summary and then ratcheted: `ci/baselines.json` freezes the
# count as it stood when the check was turned on, and the check fails only when a PR makes
# it grow. Fixing violations is reported, never punished — whoever lowers the count lowers
# the baseline in the same PR (`pnpm ci:ratchet webkit-adoption --update`).
#
# It needs nothing from the rest of the pipeline — no build, no artifact — so being
# independent costs it nothing. Eventually the whole file becomes one `uses:` of
# @aziontech/webkit's own reusable workflow, once that carries a baseline of its own.

on:
  pull_request:
    branches:
      - main
      - release/new-azion-docs
    types: [opened, synchronize, reopened]
    # Deliberately no `paths:` filter. This is a required check, and a workflow whose path
    # filter does not match never runs — so it never reports, and branch protection waits
    # on it forever. A check that is cheap (36 s) and always reports beats a check that is
    # sometimes free and sometimes deadlocks the merge.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design-system-adoption:
    name: Design system adoption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The report goes to the Summary first, unconditionally, so the number reaches the
      # reader whatever the ratchet below decides.
      - name: Adoption report
        if: always()
        continue-on-error: true
        run: |
          pnpm lint:webkit
          pnpm --silent report:webkit-adoption >> "$GITHUB_STEP_SUMMARY"

      # Blocking, against the frozen count. This step used to demand zero, which kept it red
      # on every PR while the MDX debt was being paid down category by category — and a
      # check that is always red blocks nobody, because nobody reads it. The ratchet fails
      # the one PR that adds a violation, names the delta, and lets the rest merge. Same
      # mechanism as the other four ratchets in ci/baselines.json; the baseline goes down as
      # the fixes land and never up.
      - name: No new design-system violations (ratchet)
        run: pnpm ci:ratchet webkit-adoption
