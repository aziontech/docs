name: Weekly link check
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, 03:00 GMT-3
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check internal links
        id: linkcheck
        run: |
          pnpm build:local
          pnpm exec tsm --require=./scripts/lib/filter-warnings.cjs ./scripts/lint-linkcheck.ts
        env:
          SKIP_OG: 'true'
          NODE_OPTIONS: --max-old-space-size=8120

      - name: File an issue on breakage
        if: steps.linkcheck.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'broken-links';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = existing.data.filter((i) => !i.pull_request);
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing as of the latest run: ${run}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly link check is failing',
              labels: [label],
              body: [
                'The weekly internal link check failed.',
                '',
                `Run: ${run}`,
                '',
                'This issue stays open and collects a comment per failing run. Close it once the run is green.',
              ].join('\n'),
            });
