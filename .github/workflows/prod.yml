name: Documentation production pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A deploy is never cancelled mid-flight: two merges landing close together would leave
# `gsutil rsync -d` racing over the same bucket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production publising
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: CHECKOUT project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: SETTING pnpm
        uses: pnpm/action-setup@v4

      - name: SETTING Node and Github Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - name: INSTALLING DEPENDENCIES
        run: |
          pnpm install --frozen-lockfile

      - name: BUILD
        run: |
          export NODE_OPTIONS="--max-old-space-size=8120"
          export PUBLIC_GITHUB_TOKEN="${{ secrets.GH_PACKAGES_SECRET }}"
          pnpm run build:prod

      - name: UPDATE Algolia data
        # Through `env:`, not argv — a secret on the command line is readable in the
        # runner's process list.
        env:
          ALGOLIA_APP: ${{ secrets.ALGOLIA_CONF_APP }}
          ALGOLIA_API: ${{ secrets.ALGOLIA_CONF_API }}
        run: |
          pnpm exec tsx cicd/algolia-reindex.ts "app=$ALGOLIA_APP" "api=$ALGOLIA_API"

      - name: 'AUTH Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_EXP_ENG }}

      - uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'
          
      - name: PUBLISHING
        run: |
          gsutil -m rsync -r -d dist  gs://azdocs

      - name: UPDATING Google Cloud Storage files Cache-Control header
        run: |
          gcloud storage objects update -r gs://azdocs --cache-control="public, max-age=120"

      - name: PURGE Edge Cache
        run: |
          node ./cicd/cdn-purge.js 
        env:
          AZION_TOKEN: ${{ secrets.AZION_TOKEN }}
