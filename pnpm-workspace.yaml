packages:
  - apps/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: true
  # Reaches us through @aziontech/webkit -> @vueuse/core. Its postinstall only
  # picks the Vue 2/3 shim, and this project is Vue 3.
  vue-demi: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.3'
  - '@astrojs/markdown-satteri@0.3.6'
  - astro@7.2.3
  - '@aziontech/theme@4.3.1 || 5.0.0'
  - '@aziontech/webkit@5.3.0'
patchedDependencies:
  '@aziontech/webkit@5.3.0': patches/@aziontech__webkit@5.3.0.patch
overrides:
  'lodash-es@<4.17.24': ^4.18.1
  'brace-expansion@^5.0.0': ^5.0.12
