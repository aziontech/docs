allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: true
  # Reaches us through @aziontech/webkit -> @vueuse/core. Its postinstall only
  # picks the Vue 2/3 shim, and this project is Vue 3.
  vue-demi: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.3'
  - '@astrojs/markdown-satteri@0.3.6'
  - astro@7.2.3
